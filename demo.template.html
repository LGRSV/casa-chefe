<meta charset="utf-8">
<title>Casa 3D</title>
<meta name="description" content="Planta 3D interativa da casa: gire, dê zoom e acenda as luzes por cômodo.">
<style>
  :root {
    --bg: #eef1f6; --fg: #17203a; --muted: #5b6785; --line: #d7dce8; --accent: #b86a12; --accent-soft: #fff1dc;
    --banner-bg: #fff8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a0f1e; --fg: #e6edf7; --muted: #9aa6bd; --line: #1f2a44; --accent: #ffc46b; --accent-soft: #1d2438; --banner-bg: #10172a; }
  }
  :root[data-theme="dark"] { --bg: #0a0f1e; --fg: #e6edf7; --muted: #9aa6bd; --line: #1f2a44; --accent: #ffc46b; --accent-soft: #1d2438; --banner-bg: #10172a; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  .banner { flex: none; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 8px 16px; background: var(--banner-bg); border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.35; }
  .banner b { color: var(--accent); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  .banner span { color: var(--muted); }
  .toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100% - 32px); box-sizing: border-box; z-index: 5; }
  .toast.show { opacity: 1; }
  casa3d-card { flex: 1; min-height: 0; --casa3d-height: 100%; border-radius: 0; }
  .timectl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .timectl[hidden] { display: none; }
  .timectl input { width: 160px; accent-color: var(--accent); }
  .timectl output { min-width: 44px; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
  .timectl button, .habtn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .bannerctl { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle; }
  .dot.ok { background: #2fa36b; } .dot.err { background: #d8473b; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 20px; width: min(420px, calc(100% - 32px)); box-sizing: border-box; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  dialog p { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  dialog input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  dialog .row button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  dialog .row button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  dialog .warn { color: #d8473b; font-size: 12px; min-height: 1em; margin-top: 8px; }
  dialog .warn.ok { color: #2fa36b; }
  dialog label a { color: var(--accent); white-space: nowrap; }
</style>
<div class="app">
  <div class="banner" role="status">
    <div><b id="modeTag">Demo</b> &nbsp;<span id="modeText">Estados simulados — toque num cômodo para abri-lo no painel e num bloco para alternar. No Home Assistant o cartão lê e comanda as entidades reais.</span></div>
    <div class="bannerctl">
      <label class="timectl" id="timectl"><span>Hora do dia</span><input id="hora" type="range" min="0" max="1439" step="5" aria-label="Hora simulada"><output id="horaOut">agora</output><button id="horaAgora" type="button">agora</button></label>
      <button class="habtn" id="haBtn" type="button">⚙️ Conectar ao HA</button>
    </div>
  </div>
  <casa3d-card id="card"></casa3d-card>
</div>
<div class="toast" id="toast"></div>
<dialog id="haDlg">
  <form method="dialog" id="haForm">
    <h2>Conectar ao Home Assistant</h2>
    <p>Com isso a casa mostra os estados reais e os toques comandam os dispositivos. O token fica salvo só neste navegador.</p>
    <label for="haUrl">1. Endereço https do seu HA (o link do Nabu Casa ou do Tailscale)</label>
    <input id="haUrl" type="text" inputmode="url" placeholder="xxxx.ui.nabu.casa ou homeassistant.xxxx.ts.net" autocomplete="url" spellcheck="false" required>
    <label for="haToken">2. Crie um token de acesso de longa duração e cole aqui <a id="haTokLink" target="_blank" rel="noopener" hidden>Criar token no seu HA ↗</a></label>
    <input id="haToken" type="password" placeholder="Perfil → Segurança → Criar token" autocomplete="off">
    <div class="warn" id="haWarn" aria-live="polite"></div>
    <div class="row">
      <button type="button" id="haDisconnect">Voltar para demo</button>
      <button type="button" id="haCancel">Cancelar</button>
      <button type="button" id="haTest">Testar</button>
      <button type="submit" class="primary">Conectar</button>
    </div>
  </form>
</dialog>
<script type="module">
/*__CARD_MODULE__*/

// ------------------------------------------------------------------
// Mock do objeto `hass` só para a demo (estados simulados)
// ------------------------------------------------------------------
const states = {};
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const mk = (id, state, attributes = {}, min = 0) => { states[id] = { entity_id: id, state, attributes, last_changed: ago(min) }; };
mk('switch.quarto_interruptor_1', 'on', { friendly_name: 'Luz Quarto' }, 12);
mk('light.0xa4c1387cf3257eb7', 'on', { friendly_name: 'LED Quarto', rgb_color: [255, 120, 60], brightness: 190, supported_color_modes: ['color_temp', 'xy'] }, 12);
mk('light.interruptor_cozinha_left', 'on', { friendly_name: 'Luz Cozinha' }, 47);
mk('switch.balcao_interruptor_1', 'off', { friendly_name: 'Luz Balcão' }, 95);
mk('light.interruptor_cozinha_center', 'off', { friendly_name: 'Luz Externa' }, 130);
mk('switch.garagem_interruptor_1', 'off', { friendly_name: 'Garagem' }, 410);
mk('switch.led_piscina_interruptor_1', 'on', { friendly_name: 'LED piscina' }, 25);
mk('switch.piscina_interruptor_1', 'on', { friendly_name: 'Piscina' }, 180);
mk('climate.ir_ac_cozinha_ac_cozinha', 'cool', { friendly_name: 'AC Cozinha', temperature: 23, current_temperature: 27, min_temp: 16, max_temp: 31, hvac_modes: ['off', 'heat_cool', 'cool', 'fan_only', 'dry'] }, 33);
mk('media_player.m_s', 'playing', { friendly_name: 'M&S', media_title: 'Netflix', volume_level: 0.35 }, 8);
mk('binary_sensor.0xa4c13846f2a0df88_occupancy', 'on', { friendly_name: 'Presença', device_class: 'occupancy' }, 3);
mk('sensor.0xa4c13846f2a0df88_illuminance', '18', { friendly_name: 'Iluminância', unit_of_measurement: 'lx' }, 1);
mk('person.sandro', 'home', { friendly_name: 'Sandro' }, 140);
// Automações reais do HA (nomes do registro); last_triggered simulado
const autos = [['automation.led_e_sensor', 'LED e sensor', 3], ['automation.botao_cama_liga_luz_quarto', 'Botão cama liga luz quarto', 12], ['automation.botao_cama_liga_balcao', 'Botão cama liga balcão', 95],
  ['automation.nova_automatizacao', 'Automação botão cama', 620], ['automation.luz_balcao_off', 'Luz balcão OFF', 130], ['automation.liga_luz_pela_manha', 'Liga luz pela manhã', 700],
  ['automation.automacao_botao_quarto', 'Automação botão quarto', 1500], ['automation.automacao_luz_balcao', 'Automação luz balcão ON', 95], ['automation.botao_balcao_1', 'Botão balcão - 1', 2900],
  ['automation.botao_balcao_3', 'Botão balcão - 3', 0], ['automation.botao_quarto_1', 'Botão quarto 1', 4100], ['automation.botao_quarto_2', 'Botão quarto 2', 0]];
for (const [id, name, min] of autos) mk(id, id === 'automation.botao_quarto_2' ? 'off' : 'on', { friendly_name: name, last_triggered: min ? ago(min) : null, mode: 'single' }, 99999);

const toastEl = document.getElementById('toast'); let toastT = 0;
// texto de sensor para o toast, com as mesmas palavras do cartão ("Presença: alguém no quarto", "Sandro: em casa", "Iluminância: 18 lx")
const sensorText = (s) => {
  const a = s.attributes, id = s.entity_id;
  const v = id.startsWith('binary_sensor.') ? (s.state === 'on' ? 'alguém no quarto' : 'ninguém') : id.startsWith('person.') ? ({ home: 'em casa', not_home: 'fora' }[s.state] || s.state) : `${s.state}${a.unit_of_measurement ? ' ' + a.unit_of_measurement : ''}`;
  return `${a.friendly_name || id}: ${v}`;
};
const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600); };

const card = document.getElementById('card');
// Modo ao vivo: quando há endereço+token salvos, `live` assume e o mock fica parado
let live = null;
const push = () => { if (live) return; card.hass = { states: { ...states }, language: 'pt', callService }; };
// Simula os serviços que o cartão usa (com a latência de um interruptor Wi-Fi)
function callService(domain, service, data) {
  const id = data && data.entity_id; const s = states[id]; if (!s) return;
  const set = (state, attrs) => { s.state = state; if (attrs) Object.assign(s.attributes, attrs); s.last_changed = new Date().toISOString(); push(); };
  const later = (fn) => setTimeout(fn, 220);
  const isMedia = domain === 'media_player' || id.startsWith('media_player.');
  if (service === 'toggle') later(() => set(isMedia ? (s.state === 'off' ? 'playing' : 'off') : (s.state === 'on' ? 'off' : 'on')));
  else if (service === 'turn_on') {
    const attrs = {};
    if (data.rgb_color) attrs.rgb_color = data.rgb_color;
    if (data.brightness_pct != null) attrs.brightness = Math.round(data.brightness_pct * 2.55);
    if (data.brightness != null) attrs.brightness = data.brightness;
    later(() => set(isMedia ? 'playing' : 'on', attrs));
  }
  else if (service === 'turn_off') later(() => set('off'));
  else if (service === 'set_hvac_mode') later(() => set(data.hvac_mode));
  else if (service === 'set_temperature') later(() => set(s.state, { temperature: data.temperature }));
  else if (service === 'media_play_pause') later(() => set(s.state === 'playing' ? 'paused' : 'playing'));
  else if (service === 'volume_up') set(s.state, { volume_level: Math.min(1, +((s.attributes.volume_level || 0.3) + 0.05).toFixed(2)) });
  else if (service === 'volume_down') set(s.state, { volume_level: Math.max(0, +((s.attributes.volume_level || 0.3) - 0.05).toFixed(2)) });
  else if (domain === 'automation' && service === 'trigger') {
    // efeito plausível de cada automação real
    const fx = { 'automation.led_e_sensor': () => states['light.0xa4c1387cf3257eb7'].state = 'on', 'automation.botao_cama_liga_luz_quarto': () => { const l = states['light.0xa4c1387cf3257eb7']; l.state = l.state === 'on' ? 'off' : 'on'; l.attributes.rgb_color = [203, 240, 255]; },
      'automation.botao_cama_liga_balcao': () => { const l = states['light.0xa4c1387cf3257eb7']; l.state = 'on'; l.attributes.rgb_color = [255, 171, 1]; }, 'automation.nova_automatizacao': () => { for (const k of ['switch.quarto_interruptor_1', 'light.0xa4c1387cf3257eb7', 'light.interruptor_cozinha_left', 'switch.balcao_interruptor_1', 'light.interruptor_cozinha_center', 'switch.led_piscina_interruptor_1', 'switch.piscina_interruptor_1']) states[k].state = 'off'; },
      'automation.luz_balcao_off': () => states['switch.balcao_interruptor_1'].state = 'off', 'automation.liga_luz_pela_manha': () => states['light.interruptor_cozinha_left'].state = 'on', 'automation.automacao_luz_balcao': () => states['switch.balcao_interruptor_1'].state = 'on' };
    later(() => { (fx[id] || (() => {}))(); for (const k of Object.keys(states)) states[k].last_changed = states[k].last_changed; s.attributes.last_triggered = new Date().toISOString(); push(); });
  }
}
card.addEventListener('hass-more-info', (e) => {
  if (live) { live.moreInfo(e.detail.entityId); return; }
  const id = e.detail.entityId; const s = states[id]; if (!s) return;
  if (id.startsWith('climate.')) { s.state = s.state === 'off' ? 'cool' : 'off'; toast(`No Home Assistant isso abre o painel do ${s.attributes.friendly_name}. Na demo: ${s.state === 'off' ? 'desligado' : 'ligado (frio)'}.`); }
  else if (id.startsWith('media_player.')) { s.state = { playing: 'paused', paused: 'off', off: 'playing' }[s.state] || 'playing'; toast(`No Home Assistant isso abre o controle da TV. Na demo: ${s.state}.`); }
  else toast(sensorText(s));   // sensores (presença, iluminância, pessoa): só mostra o estado
  push();
});
card.setConfig({ title: 'Casa 3D', labels: true, mode: 'auto', height: '100%' });
push();
// Controle de hora simulada (só na demo): anda o relógio e o sol
const hora = document.getElementById('hora'), horaOut = document.getElementById('horaOut');
const fmtTZ = (dt) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }).format(dt);
const nowMin = () => { const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date()); const h = +p.find((x) => x.type === 'hour').value % 24, m = +p.find((x) => x.type === 'minute').value; return h * 60 + m; };
hora.value = nowMin();
hora.addEventListener('input', () => {
  const target = +hora.value, cur = nowMin();
  const dt = new Date(Date.now() + (target - cur) * 60000);
  card.setSimTime(dt); horaOut.textContent = fmtTZ(dt);
  // o sun.sun simulado acompanha
});
document.getElementById('horaAgora').addEventListener('click', () => { card.setSimTime(null); hora.value = nowMin(); horaOut.textContent = 'agora'; });

// ------------------------------------------------------------------
// Modo ao vivo: conecta na API WebSocket do Home Assistant
// ------------------------------------------------------------------
const LS_URL = 'casa3d.ha_url', LS_TOKEN = 'casa3d.ha_token';
const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const modeTag = document.getElementById('modeTag'), modeText = document.getElementById('modeText'), timectl = document.getElementById('timectl');
const setBanner = (tag, html) => { modeTag.textContent = tag; modeText.innerHTML = html; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// endereço como o usuário colar ("xxxx.ui.nabu.casa", ".../lovelace/0", barra no fim) → só a origem; '' se não parece endereço
const normUrl = (v) => { v = v.trim(); if (!v) return ''; try { const u = new URL(/^https?:\/\//i.test(v) ? v : 'https://' + v); return /[.:]/.test(u.host) ? u.origin : ''; } catch (e) { return ''; } };
const wsUrlOf = (url) => url.replace(/^http/, 'ws').replace(/\/+$/, '') + '/api/websocket';

function connectLive(baseUrl, token) {
  const host = new URL(baseUrl).host;
  const wsUrl = wsUrlOf(baseUrl);
  const liveStates = {}; let config = null, ws = null, nextId = 1, closed = false, retry = 0, retryT = 0, raf = 0;
  const pending = new Map();
  const status = (cls, msg) => setBanner('Ao vivo', `<span class="dot ${cls}"></span>${msg}`);
  const render = () => { raf = 0; card.hass = { states: { ...liveStates }, config: config || undefined, language: 'pt', callService }; };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(render); };
  const send = (msg) => new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) { reject(new Error('sem conexão')); return; }
    const id = nextId++; pending.set(id, { resolve, reject }); ws.send(JSON.stringify({ id, ...msg }));
  });
  function callService(domain, service, data) {
    return send({ type: 'call_service', domain, service, service_data: data || {} })
      .catch((err) => toast(`Falhou: ${domain}.${service} (${err.message})`));
  }
  function open() {
    status('', `Conectando a ${esc(host)}…`);
    ws = new WebSocket(wsUrl);
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'auth_required') { ws.send(JSON.stringify({ type: 'auth', access_token: token })); return; }
      if (m.type === 'auth_invalid') { closed = true; ws.close(); status('err', 'Token recusado pelo Home Assistant. Toque em ⚙️ e confira o token.'); return; }
      if (m.type === 'auth_ok') {
        retry = 0;
        send({ type: 'get_config' }).then((c) => { config = c; schedule(); }).catch(() => {});
        send({ type: 'get_states' }).then((list) => {
          for (const k of Object.keys(liveStates)) delete liveStates[k];
          for (const s of list) liveStates[s.entity_id] = s;
          schedule(); status('ok', `Conectado a ${esc(host)} — toques comandam a casa de verdade.`);
        }).catch(() => {});
        send({ type: 'subscribe_events', event_type: 'state_changed' }).catch(() => {});
        return;
      }
      if (m.type === 'event' && m.event && m.event.event_type === 'state_changed') {
        const d = m.event.data;
        if (d.new_state) liveStates[d.entity_id] = d.new_state; else delete liveStates[d.entity_id];
        schedule(); return;
      }
      if (m.type === 'result' && pending.has(m.id)) {
        const p = pending.get(m.id); pending.delete(m.id);
        m.success ? p.resolve(m.result) : p.reject(new Error((m.error && m.error.message) || 'erro'));
      }
    };
    ws.onclose = () => {
      for (const p of pending.values()) p.reject(new Error('conexão caiu')); pending.clear();
      if (closed) return;
      const wait = Math.min(30, 2 ** retry++);
      status('err', `Sem conexão com ${esc(host)}. Tentando de novo em ${wait}s…`);
      retryT = setTimeout(open, wait * 1000);
    };
  }
  open();
  return {
    stop() { closed = true; clearTimeout(retryT); if (ws) ws.close(); },
    moreInfo(id) {
      const s = liveStates[id]; if (!s) { toast(`Entidade ${id} não existe no seu Home Assistant.`); return; }
      if (id.startsWith('climate.')) callService('climate', 'set_hvac_mode', { entity_id: id, hvac_mode: s.state === 'off' ? 'cool' : 'off' });
      else if (id.startsWith('media_player.')) callService('media_player', 'media_play_pause', { entity_id: id });
      else toast(sensorText(s));
    },
  };
}

// "Testar": só o aperto de mão do WebSocket (auth_required → auth → auth_ok/auth_invalid) + get_states para contar; não muda o modo atual
function testHA(url, token) {
  const longe = { ok: false, msg: `Não consegui chegar em ${new URL(url).host} — confira o endereço` };
  return new Promise((resolve) => {
    let ws = null;
    const done = (r) => { clearTimeout(t); resolve(r); if (ws) ws.close(); };
    const t = setTimeout(() => done(longe), 8000);
    try { ws = new WebSocket(wsUrlOf(url)); } catch (e) { done(longe); return; }
    ws.onclose = () => done(longe);
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'auth_required') ws.send(JSON.stringify({ type: 'auth', access_token: token }));
      else if (m.type === 'auth_invalid') done({ ok: false, msg: 'Token recusado — gere outro' });
      else if (m.type === 'auth_ok') ws.send(JSON.stringify({ id: 1, type: 'get_states' }));
      else if (m.type === 'result') done({ ok: true, msg: `Funcionou: ${m.success && Array.isArray(m.result) ? m.result.length : '?'} entidades. Toque em Conectar.` });
    };
  });
}

function startLive(url, token) {
  if (live) live.stop();
  card.setSimTime(null); timectl.hidden = true;
  live = connectLive(url, token);
}
function stopLive() {
  if (live) live.stop(); live = null; timectl.hidden = false;
  setBanner('Demo', 'Estados simulados — toque num cômodo para abri-lo no painel e num bloco para alternar. Toque em ⚙️ para conectar ao seu Home Assistant.');
  push();
}

const dlg = document.getElementById('haDlg'), urlIn = document.getElementById('haUrl'), tokIn = document.getElementById('haToken'), warn = document.getElementById('haWarn'), tokLink = document.getElementById('haTokLink');
// endereço válido → link direto para a página de tokens do próprio HA
const syncLink = () => { const u = normUrl(urlIn.value); tokLink.hidden = !u; if (u) tokLink.href = u + '/profile/security'; };
urlIn.addEventListener('input', syncLink);
const say = (msg, ok) => { warn.className = ok ? 'warn ok' : 'warn'; warn.textContent = msg; };
// lê e confere o formulário (Testar e Conectar); null = já explicou o problema
function readForm() {
  const url = normUrl(urlIn.value), token = tokIn.value.trim() || lsGet(LS_TOKEN);
  if (!url) { say('Confira o endereço (ex.: xxxx.ui.nabu.casa).'); return null; }
  if (location.protocol === 'https:' && url.startsWith('http:')) { say('Este site é https: o endereço do HA também precisa ser https (ex.: o link do Tailscale Funnel).'); return null; }
  if (!token) { say('Cole o token de acesso de longa duração.'); return null; }
  return { url, token };
}
document.getElementById('haBtn').addEventListener('click', () => {
  urlIn.value = lsGet(LS_URL); tokIn.value = ''; tokIn.placeholder = lsGet(LS_TOKEN) ? 'Token salvo — deixe vazio para manter' : 'Perfil → Segurança → Criar token';
  say(''); syncLink(); dlg.showModal();
});
document.getElementById('haTest').addEventListener('click', async () => {
  const f = readForm(); if (!f) return;
  say('Testando…'); const r = await testHA(f.url, f.token); say(r.msg, r.ok);
});
document.getElementById('haCancel').addEventListener('click', () => dlg.close());
document.getElementById('haDisconnect').addEventListener('click', () => { lsSet(LS_URL, ''); lsSet(LS_TOKEN, ''); dlg.close(); stopLive(); });
document.getElementById('haForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = readForm(); if (!f) return;
  lsSet(LS_URL, f.url); lsSet(LS_TOKEN, f.token); dlg.close(); startLive(f.url, f.token);
});
// Também aceita #ha=https://... no link (sem o token) para pré-preencher o endereço
const hashUrl = new URLSearchParams(location.hash.slice(1)).get('ha');
if (hashUrl && !lsGet(LS_URL)) lsSet(LS_URL, hashUrl);
if (lsGet(LS_URL) && lsGet(LS_TOKEN)) startLive(lsGet(LS_URL), lsGet(LS_TOKEN));
</script>
